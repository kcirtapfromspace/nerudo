# Landing rules for the nerudo sequencer. Lives in the repo, like .gitattributes.

[footprint]
# Each child of these directories is one footprint unit. Any other path is its own unit.
units = ["targets/*"]

# Merged by rule instead of serialized: lines a change appends are appended at landing.
[[commutative]]
path = "CHANGELOG.md"
rule = "append"

# Never taken from a change: regenerated by the sequencer after each change is applied.
[[derived]]
path = "deps.lock"
command = ["python3", "ci/gen_lock.py"]

# Changes write <pending_prefix><name>; the sequencer assigns the number at landing.
[[allocate]]
dir = "migrations"
pending_prefix = "NEXT_"
width = 4

[ci]
command = ["python3", "ci/check.py"]
env = { CI_MAIN = "1" }
