[package]
name = "nerudo-worker"
version = "0.1.0"
edition = "2021"
description = "nerudo on Cloudflare: a Trunk Durable Object that is the only writer of trunk."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
nerudo-git = { path = "../nerudo-git" }
nerudo-core = { path = "../nerudo-core" }
worker = "0.8.7"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }
