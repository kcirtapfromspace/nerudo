[package]
name = "nerudo-core"
version = "0.1.0"
edition = "2021"
description = "Landing rules, tree merge, gates, log and seals for the nerudo sequencer. Pure Rust, wasm-compatible."
license = "MIT OR Apache-2.0"

[dependencies]
nerudo-git = { path = "../nerudo-git" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["alloc"] }
diffy = "0.5.2"

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
