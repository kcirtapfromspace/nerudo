[package]
name = "seqd"
version = "0.1.0"
edition = "2024"
description = "Landing sequencer MVP: single writer to trunk, footprint batching, derived/commutative files"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.2", features = ["full"] }
toml = "1.1.6"
